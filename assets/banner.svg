<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="shelfie">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="55%" stop-color="#4fd18b"/>
      <stop offset="100%" stop-color="#9d6bf5"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ecc71" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9d6bf5" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="640" height="200" rx="14" fill="#0f1117"/>

  <!-- books sliding onto a shelf: the whole idea, in one picture -->
  <g transform="translate(34,44)">
    <!-- tidy, shelved -->
    <g opacity="0.95">
      <rect x="0"  y="6"  width="15" height="62" rx="3" fill="#2ecc71"/>
      <rect x="20" y="0"  width="12" height="68" rx="3" fill="#4fd18b"/>
      <rect x="37" y="12" width="16" height="56" rx="3" fill="#6dbfa8"/>
      <rect x="58" y="4"  width="11" height="64" rx="3" fill="#7f9ee0"/>
      <rect x="74" y="16" width="15" height="52" rx="3" fill="#9d6bf5"/>
    </g>
    <!-- the shelf itself -->
    <rect x="-8" y="72" width="112" height="7" rx="3.5" fill="url(#shelf)"/>

    <!-- loose files still tumbling in, at angles -->
    <g opacity="0.55">
      <rect x="132" y="10" width="13" height="52" rx="3" fill="#9d6bf5" transform="rotate(14 138 36)"/>
      <rect x="158" y="22" width="13" height="46" rx="3" fill="#7f9ee0" transform="rotate(-21 164 45)"/>
      <rect x="186" y="4"  width="13" height="56" rx="3" fill="#4fd18b" transform="rotate(31 192 32)"/>
    </g>

    <!-- direction of travel -->
    <path d="M212 40 L238 40" stroke="#9d6bf5" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M230 32 L239 40 L230 48" fill="none" stroke="#9d6bf5" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  </g>

  <g filter="url(#soft)">
    <text x="300" y="92" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif"
          font-size="62" font-weight="700" fill="url(#g)" letter-spacing="-1.5">shelfie</text>
  </g>
  <text x="302" y="124" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif"
        font-size="16" fill="#8b93a7" letter-spacing="0.4">Shelve your Downloads folder.</text>
  <text x="302" y="146" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif"
        font-size="16" fill="#8b93a7" letter-spacing="0.4">One command.</text>

  <rect x="302" y="163" width="58" height="3" rx="1.5" fill="#2ecc71"/>
  <rect x="366" y="163" width="26" height="3" rx="1.5" fill="#9d6bf5" opacity="0.75"/>
</svg>
