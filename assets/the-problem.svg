<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img"
     aria-label="Sorting by file type splits a job apart; sorting by use keeps it together.">
  <defs>
    <style>
      .t   { font-family: ui-sans-serif, "Segoe UI", Helvetica, Arial, sans-serif; }
      .h   { font-size: 15px; font-weight: 700; }
      .s   { font-size: 11.5px; }
      .m   { font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
      .mut { fill: #8b93a7; }
    </style>
  </defs>

  <rect width="880" height="400" rx="12" fill="#0f1117"/>

  <!-- the job, at the top -->
  <text x="34" y="34" class="t s mut">One job for one client produces four files:</text>
  <g class="t m">
    <rect x="34" y="44" width="150" height="26" rx="4" fill="#161a23" stroke="#e3b341" stroke-width="1"/>
    <text x="44" y="61" fill="#e3b341">contract.pdf</text>

    <rect x="196" y="44" width="150" height="26" rx="4" fill="#161a23" stroke="#e3b341" stroke-width="1"/>
    <text x="206" y="61" fill="#e3b341">shoot-01.jpg</text>

    <rect x="358" y="44" width="150" height="26" rx="4" fill="#161a23" stroke="#e3b341" stroke-width="1"/>
    <text x="368" y="61" fill="#e3b341">site-backup.zip</text>

    <rect x="520" y="44" width="150" height="26" rx="4" fill="#161a23" stroke="#e3b341" stroke-width="1"/>
    <text x="530" y="61" fill="#e3b341">invoice.pdf</text>
  </g>

  <line x1="34" y1="92" x2="846" y2="92" stroke="#242938"/>

  <!-- LEFT: by type -->
  <text x="34" y="122" class="t h" fill="#f0616d">Sorted by file type</text>
  <text x="34" y="141" class="t s mut">What almost every tool does. Fully automatic —</text>
  <text x="34" y="157" class="t s mut">and it scatters the job across four branches.</text>

  <g class="t m">
    <rect x="34" y="176" width="176" height="30" rx="4" fill="#1d2230"/>
    <text x="44" y="196" fill="#8b93a7">Documents/</text>
    <text x="128" y="196" fill="#f0616d">contract.pdf</text>

    <rect x="34" y="212" width="176" height="30" rx="4" fill="#1d2230"/>
    <text x="44" y="232" fill="#8b93a7">Images/</text>
    <text x="128" y="232" fill="#f0616d">shoot-01.jpg</text>

    <rect x="34" y="248" width="176" height="30" rx="4" fill="#1d2230"/>
    <text x="44" y="268" fill="#8b93a7">Archives/</text>
    <text x="120" y="268" fill="#f0616d">site-backup</text>

    <rect x="34" y="284" width="176" height="30" rx="4" fill="#1d2230"/>
    <text x="44" y="304" fill="#8b93a7">Documents/</text>
    <text x="132" y="304" fill="#f0616d">invoice.pdf</text>
  </g>

  <text x="34" y="342" class="t s" fill="#f0616d">Six months later you know you did the work.</text>
  <text x="34" y="360" class="t s mut">You cannot assemble it again without searching four</text>
  <text x="34" y="376" class="t s mut">folders and remembering every filename.</text>

  <line x1="452" y1="106" x2="452" y2="380" stroke="#242938"/>

  <!-- RIGHT: by use -->
  <text x="486" y="122" class="t h" fill="#2ecc71">Sorted by how you use it</text>
  <text x="486" y="141" class="t s mut">shelfie reads the folders under Projects/ and treats</text>
  <text x="486" y="157" class="t s mut">them as names it knows.</text>

  <rect x="486" y="176" width="330" height="138" rx="6" fill="#161a23" stroke="#2ecc71" stroke-width="1.4"/>
  <text x="500" y="199" class="t m" fill="#2ecc71">Projects/acme-corp/</text>
  <g class="t m" fill="#e6e9ef">
    <text x="520" y="223">contract.pdf</text>
    <text x="520" y="245">shoot-01.jpg</text>
    <text x="520" y="267">site-backup.zip</text>
    <text x="520" y="289">invoice.pdf</text>
  </g>
  <g stroke="#2ecc71" stroke-width="1" opacity=".45">
    <path d="M508 216 L514 216"/><path d="M508 238 L514 238"/>
    <path d="M508 260 L514 260"/><path d="M508 282 L514 282"/>
    <path d="M508 206 L508 282"/>
  </g>

  <text x="486" y="342" class="t s" fill="#2ecc71">The job stays a job.</text>
  <text x="486" y="360" class="t s mut">One folder. When it finishes, the whole thing moves to</text>
  <text x="486" y="376" class="t s mut">Archive/ in a single drag. That is the entire trick.</text>
</svg>
