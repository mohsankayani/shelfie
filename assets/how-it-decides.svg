<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img"
     aria-label="How shelfie decides where a file goes: project name, then name pattern, then extension, then give up honestly.">
  <defs>
    <style>
      .t   { font-family: ui-sans-serif, "Segoe UI", Helvetica, Arial, sans-serif; }
      .h   { font-size: 13.5px; font-weight: 700; }
      .s   { font-size: 11.5px; }
      .m   { font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
      .mut { fill: #8b93a7; }
    </style>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b93a7"/>
    </marker>
  </defs>

  <rect width="880" height="360" rx="12" fill="#0f1117"/>

  <text x="34" y="34" class="t h" fill="#e6e9ef">How shelfie decides where a file goes</text>
  <text x="34" y="53" class="t s mut">Four rules, in this order. The first one that matches wins.</text>

  <!-- the file entering -->
  <rect x="34" y="76" width="196" height="30" rx="4" fill="#161a23" stroke="#e3b341"/>
  <text x="44" y="96" class="t m" fill="#e3b341">acme-corp-logo.png</text>
  <path d="M236 91 L264 91" stroke="#8b93a7" stroke-width="1.3" marker-end="url(#d)"/>

  <!-- rule 1 -->
  <rect x="270" y="70" width="330" height="42" rx="6" fill="#161a23" stroke="#2ecc71" stroke-width="1.6"/>
  <text x="284" y="88" class="t h" fill="#2ecc71">1 · Does the name mention a project?</text>
  <text x="284" y="104" class="t s mut">Reads the folders already under Projects/</text>
  <path d="M606 91 L640 91" stroke="#2ecc71" stroke-width="1.6" marker-end="url(#d)"/>
  <rect x="646" y="76" width="200" height="30" rx="4" fill="#0f2318" stroke="#2ecc71"/>
  <text x="656" y="96" class="t m" fill="#2ecc71">Projects/acme-corp/</text>

  <text x="284" y="128" class="t s" fill="#2ecc71">✓ match — beats the .png extension entirely</text>

  <!-- rule 2 -->
  <rect x="270" y="146" width="330" height="42" rx="6" fill="#161a23" stroke="#59c9a5" stroke-width="1.2" opacity=".75"/>
  <text x="284" y="164" class="t h" fill="#59c9a5">2 · Does the name match a pattern?</text>
  <text x="284" y="180" class="t s mut">invoice · receipt · .wpress · id_rsa · driver …</text>
  <text x="614" y="171" class="t s mut">→ Documents/Financial</text>

  <!-- rule 3 -->
  <rect x="270" y="200" width="330" height="42" rx="6" fill="#161a23" stroke="#7f9ee0" stroke-width="1.2" opacity=".75"/>
  <text x="284" y="218" class="t h" fill="#7f9ee0">3 · What is the extension?</text>
  <text x="284" y="234" class="t s mut">.mp4 → Media/Video   .pdf → Documents/PDF</text>
  <text x="614" y="225" class="t s mut">→ Media/Video</text>

  <!-- rule 4 -->
  <rect x="270" y="254" width="330" height="42" rx="6" fill="#161a23" stroke="#e3b341" stroke-width="1.2" opacity=".75"/>
  <text x="284" y="272" class="t h" fill="#e3b341">4 · Not sure? Then say so.</text>
  <text x="284" y="288" class="t s mut">Files go to Inbox/. Folders are left where they are.</text>
  <text x="614" y="279" class="t s mut">→ Inbox/ or untouched</text>

  <text x="34" y="326" class="t s mut">Extension is the <tspan fill="#e6e9ef">last</tspan> resort, because extensions lie — a .zip can be a plugin, a template, a backup or a photo dump.</text>
  <text x="34" y="344" class="t s mut">Ten things in an inbox beats ten things filed wrongly: wrong filing is invisible until you go looking for something.</text>
</svg>
